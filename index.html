<!DOCTYPE html>
<html lang = "fr">
    <head>
        <meta charset = "UTF-8">
        <meta content = "Tournoi de pétanque Beckers" name = "description">
        <meta content = "Vandeputte François" name = "author">
<!--        <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">-->
        <title>Beckers Cup</title>
        <link href = "styles/style.css" rel = "stylesheet" type = "text/css">
        <script src = "https://cdn.tailwindcss.com"></script>
        <script src = "script.js" defer></script>
    </head>

    <body>
        <main>
            <img id = "main-image" src = "https://media.discordapp.net/attachments/814147584054657026/1141375312857411604/IMG_3438.JPG?width=1056&height=657" alt = "main"/>

            <div id = "logo-container">
                <img id = "logo-bg" src = "https://media.discordapp.net/attachments/814147584054657026/1141375322546249939/IMG_3448.JPG?width=665&height=499" alt = "logo-bg">
                <img id = "logo" src = "https://media.discordapp.net/attachments/814147584054657026/1146543268176343220/cup-or.png?width=483&height=597" alt = "logo">
            </div>
        </main>

        <div id = "tournaments">
            <div class = "header">
                <label id = "select-label">
                    <select class = "form-control">
                        <option value = "2023">Tournoi 2023</option>
                        <option value = "2022">Tournoi 2022</option>
                    </select>
                    <svg width = "32" height = "32" fill = "#FFFFFF" viewBox = "0 0 16 16">
                        <path d = "M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                    </svg>
                </label>
            </div>

            <section id = "tournament"></section>
        </div>

        <section id = "galerie">
            <div class = "header">
                <h3 id = "galerie-header">Galerie</h3>
            </div>

            <section id = "container">
                <div class = "handle left-handle">
                    <div class = "text">&#8249;</div>
                </div>

                <div id = "slider">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375278048890891/IMG_3427.JPG?width=855&height=657" alt = "Image 3427">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375278623506503/IMG_3428.JPG?width=1019&height=657" alt = "Image 3428">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375279160365146/IMG_3429.JPG?width=1232&height=657" alt = "Image 3429">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375279881801789/IMG_3430.JPG?width=864&height=657" alt = "Image 3430">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375281169453066/IMG_3432.JPG?width=889&height=657" alt = "Image 3432">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375282398367754/IMG_3434.JPG?width=865&height=657" alt = "Image 3434">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375311393595412/IMG_3435.JPG?width=853&height=657" alt = "Image 3435">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375311934652526/IMG_3436.JPG?width=861&height=657" alt = "Image 3436">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375312454754324/IMG_3437.JPG?width=1023&height=657" alt = "Image 3437">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375313427824820/IMG_3439.JPG?width=875&height=657" alt = "Image 3439">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375314052784329/IMG_3440.JPG?width=866&height=657" alt = "Image 3440">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375314551910481/IMG_3441.JPG?width=889&height=657" alt = "Image 3441">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375315105546361/IMG_3442.JPG?width=883&height=657" alt = "Image 3442">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375315600482355/IMG_3443.JPG?width=865&height=657" alt = "Image 3443">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375319928995971/IMG_3444.JPG?width=665&height=499" alt = "Image 3444">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375321409601567/IMG_3446.JPG?width=665&height=499" alt = "Image 3446">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375321967427604/IMG_3447.JPG?width=665&height=499" alt = "Image 3447">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375322546249939/IMG_3448.JPG?width=665&height=499" alt = "Image 3448">
                    <img src = "https://media.discordapp.net/attachments/814147584054657026/1141375323187986442/IMG_3449.JPG?width=665&height=499" alt = "Image 3449">
                </div>

                <div class = "handle right-handle">
                    <div class = "text">&#8250;</div>
                </div>
            </section>

            <div id = "progress-bar"></div>
        </section>

        <div id = "image-viewer" class = "invisible">
            <img id = "large-image" src = "" alt = "Large Image">
            <button id = "close-button">Fermer</button>
        </div>

        <section class = "teammaker">
            <div class = "header">
                <h3 id = "teammaker-header">Composition équipes</h3>
            </div>

            <form>
                <label>
                    <textarea placeholder = "Veuillez entrer les noms des compétiteurs ligne par ligne"></textarea>
                </label>

                <label>
                    <input id = "submit-form" type = "submit" value = "Valider"/>
                </label>
            </form>

            <div id = "teams">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </section>
    </body>
